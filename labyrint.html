<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labyrinth Prototype</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #222;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
    }

    .ball {
        position: absolute;
        width: 30px;
        height: 30px;
        background: red;
        border-radius: 50%;
    }

    .goal {
        position: absolute;
        width: 40px;
        height: 40px;
        background: limegreen;
        border-radius: 50%;
    }
</style>
</head>
<body>

<div id="game">
    <div id="ball" class="ball"></div>
    <div id="goal" class="goal"></div>
</div>

<script>
let ball = document.getElementById("ball");
let goal = document.getElementById("goal");

let x = window.innerWidth / 2;
let y = window.innerHeight / 2;

let goalX = window.innerWidth * 0.8;
let goalY = window.innerHeight * 0.7;

ball.style.left = x + "px";
ball.style.top = y + "px";

goal.style.left = goalX + "px";
goal.style.top = goalY + "px";

// Bevegelse med mobilens tilt
window.addEventListener("deviceorientation", (event) => {
    let tiltX = event.gamma; // left-right
    let tiltY = event.beta;  // front-back

    // Juster hastighet
    x += tiltX * 0.2;
    y += tiltY * 0.2;

    // Begrensning innen skjerm
    x = Math.max(0, Math.min(window.innerWidth - 30, x));
    y = Math.max(0, Math.min(window.innerHeight - 30, y));

    ball.style.left = x + "px";
    ball.style.top = y + "px";

    checkCollision();
});

// Kollisjonssjekk
function checkCollision() {
    let dx = x - goalX;
    let dy = y - goalY;
    let distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 35) {
        alert("🎯 Du traff målet!");
        resetGame();
    }
}

function resetGame() {
    x = window.innerWidth / 2;
    y = window.innerHeight / 2;
}
</script>

</body>
</html>
