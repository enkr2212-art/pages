<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Registrer Kartpunkt</title>
  <style>
    body { font-family: sans-serif; margin: 30px; max-width: 400px; }
    .felt { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background: #218838; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Registrer nytt punkt på kartet</h2>
  
  <div class="felt">
    <label>Stedsnavn:</label>
    <input type="text" id="navn" placeholder="F.eks. Startstreken">
  </div>
  
  <div class="felt">
    <label>Breddegrad (Latitude):</label>
    <input type="number" id="lat" step="any" placeholder="F.eks. 59.9111">
  </div>
  
  <div class="felt">
    <label>Lengdegrad (Longitude):</label>
    <input type="number" id="lng" step="any" placeholder="F.eks. 10.7528">
  </div>

  <button id="lagreBtn">Lagre til database</button>
  <p id="status"></p>
