<script>
  // 🎯 MÅLET
  const targetLat = 61.1126534;
  const targetLon = 10.4700886;

  let userHeading = 0;

  // 📡 Kompass
  window.addEventListener("deviceorientation", (event) => {
    if (event.alpha !== null) {
      userHeading = 360 - event.alpha; // viktig fix
    }
  });

  // 📡 Live posisjon
  navigator.geolocation.watchPosition(
    (position) => {
      const userLat = position.coords.latitude;
      const userLon = position.coords.longitude;

      const distance = getDistance(userLat, userLon, targetLat, targetLon);
      const bearing = getBearing(userLat, userLon, targetLat, targetLon);

      let direction = bearing - userHeading;
      direction = (direction + 360) % 360; // viktig fix

      document.getElementById("arrow").style.transform =
        `rotate(${direction}deg)`;

      document.getElementById("info").innerHTML = `
        Avstand til mål: <strong>${Math.round(distance)} meter</strong>
      `;
    },
    (error) => {
      document.getElementById("info").innerHTML = "Feil: " + error.message;
    },
    {
      enableHighAccuracy: true
    }
  );

  // 📏 Avstand (FERDIG)
  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
  }

  // 🧭 Bearing (MANGLET HELT)
  function getBearing(lat1, lon1, lat2, lon2) {
    const toRad = deg => deg * Math.PI / 180;
    const toDeg = rad => rad * 180 / Math.PI;

    const dLon = toRad(lon2 - lon1);

    const y = Math.sin(dLon) * Math.cos(toRad(lat2));
    const x =
      Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
      Math.sin(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.cos(dLon);

    let brng = toDeg(Math.atan2(y, x));
    return (brng + 360) % 360;
  }
</script>
