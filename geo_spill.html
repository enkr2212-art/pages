<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Finn målet 🎯</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin-top: 30px;
    }

    #arrow {
      font-size: 80px;
      display: inline-block;
      transition: transform 0.2s linear;
    }

    #info {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

<h1>Finn klasserommet 🎯</h1>

<div id="arrow">⬆️</div>

<div id="info">
  Venter på GPS...
</div>

<script>
  // 🎯 MÅLET
  const targetLat = 61.1126534;
  const targetLon = 10.4700886;

  let userHeading = 0;

  // 📡 Hent retning (kompass / gyro hvis tilgjengelig)
  window.addEventListener("deviceorientation", (event) => {
    if (event.alpha !== null) {
      userHeading = event.alpha;
    }
  });

  // 📡 Live posisjon
  navigator.geolocation.watchPosition(
    (position) => {
      const userLat = position.coords.latitude;
      const userLon = position.coords.longitude;

      const distance = getDistance(userLat, userLon, targetLat, targetLon);
      const bearing = getBearing(userLat, userLon, targetLat, targetLon);

      // 🧭 Regn ut retning vi må peke
      const direction = bearing - userHeading;

      // 🔄 Roter pil
      document.getElementById("arrow").style.transform =
        `rotate(${direction}deg)`;

      // 🧾 Info
      document.getElementById("info").innerHTML = `
        Avstand til mål: <strong>${Math.round(distance)} meter</strong>
      `;
    },
    (error) => {
      document.getElementById("info").innerHTML = "Feil: " + error.message;
    },
    {
      enableHighAccuracy: true
    }
  );

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
